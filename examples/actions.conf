# clint fun /me actions
#
# One action per line. Format: "Label | action text"
#   - '#' starts a comment (ignored)
#   - blank lines are ignored
#   - a line without '|' uses the whole line as both label and text
#
# Copy this file to ~/.config/clint/actions.conf and edit it to add your own.
# The actions appear in the menu bar "Actions" menu and the toolbar "Fun" button.

Wave | waves hello
Dance | does a happy dance
Hug | hugs everyone
Slap | gives a friendly slap
Facepalm | facepalms
Coffee | brews a fresh pot of coffee
Party | throws confetti everywhere
Shrug | shrugs
Laugh | laughs out loud
Wink | winks
